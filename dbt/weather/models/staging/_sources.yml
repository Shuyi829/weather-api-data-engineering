version: 2

sources:
  - name: raw
    description: "Raw Open-Meteo batches landed by the Python extractor."
    # DuckDB always uses "raw"; on Snowflake the raw schema is configurable
    # (same SNOWFLAKE_RAW_SCHEMA env var the loader uses).
    schema: "{{ env_var('SNOWFLAKE_RAW_SCHEMA', 'RAW') if target.type == 'snowflake' else 'raw' }}"
    tables:
      - name: forecast
        description: "Hourly model forecast (incl. recent past) in UTC, one row per location/hour/batch."
        loaded_at_field: ingested_at_utc
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 36, period: hour}
        columns:
          - name: location_id
            tests: [not_null]
          - name: timestamp_utc
            tests: [not_null]
      - name: actuals
        description: "Hourly reanalysis actuals in UTC, one row per location/hour/batch."
        loaded_at_field: ingested_at_utc
        freshness:
          warn_after: {count: 48, period: hour}
          error_after: {count: 96, period: hour}
        columns:
          - name: location_id
            tests: [not_null]
          - name: timestamp_utc
            tests: [not_null]
