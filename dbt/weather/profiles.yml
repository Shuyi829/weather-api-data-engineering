# Local dbt profile. dbt-duckdb resolves the relative path from the directory
# where you run dbt (this dbt project folder), so ../../data/weather.duckdb
# points at <project-root>/data/weather.duckdb - the same file the extractor writes.
#
# Override with the WEATHER_DUCKDB env var if you keep the database elsewhere.
weather:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('WEATHER_DUCKDB', '../../data/weather.duckdb') }}"
      threads: 4
      # ICU provides IANA named-timezone support (America/New_York, Asia/Kolkata, ...)
      # used by the intermediate models for DST-aware local time.
      extensions:
        - icu

    # Snowflake target: dbt build --target snowflake
    # All settings come from env vars (see ../../.env.example). dbt does not read
    # .env itself, so load it into the shell first. Auth is key-pair when
    # SNOWFLAKE_PRIVATE_KEY_PATH is set, otherwise SNOWFLAKE_AUTHENTICATOR
    # (e.g. externalbrowser for SSO).
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      authenticator: "{{ env_var('SNOWFLAKE_AUTHENTICATOR', '') }}"
      role: "{{ env_var('SNOWFLAKE_TRANSFORMER_ROLE', 'WEATHER_TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'WEATHER_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'WEATHER') }}"
      # Prefix for dbt's schemas: <schema>_STAGING, <schema>_INTERMEDIATE, <schema>_MARTS
      schema: "{{ env_var('SNOWFLAKE_DBT_SCHEMA', 'DBT') }}"
      threads: 4
